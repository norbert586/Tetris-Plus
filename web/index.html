<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris Plus</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #screen { position: relative; background: #000; }
      #screen canvas, #screen video { position: absolute; inset: 0; width: 100%; height: 100%; }
      #screen canvas { image-rendering: pixelated; }
      #screen video { object-fit: contain; background: #000; }
      #screen.scanlines::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 50%, rgba(0,0,0,.28) 50%, rgba(0,0,0,.28) 100%);
        background-size: 100% calc(100% / 240);
      }
      #message { position: fixed; left: 0; right: 0; bottom: 6%; text-align: center; color: #fff;
        text-shadow: 0 0 4px #000, 0 0 2px #000; font-size: 16px; pointer-events: none; }
      #hint { position: absolute; left: 50%; top: 3%; transform: translateX(-50%); white-space: nowrap; color: #fff; font-size: 16px;
        background: rgba(0, 0, 0, .7); border: 1px solid #5b6fd6; border-radius: 14px; padding: 3px 14px; pointer-events: none; }
      #gate { position: fixed; left: 0; right: 0; bottom: 6%; text-align: center; color: #fff; text-shadow: 0 0 4px #000, 0 0 2px #000; }
      #gate .title { font-size: 18px; }
      #gate .note { color: #c8ccf0; font-size: 13px; margin: 2px 0; }
      #gate .row { display: flex; gap: 12px; justify-content: center; margin: 10px 0 6px; }
      #gate button { font: inherit; font-size: 16px; color: #fff; background: #1c2670; border: 1px solid #5b6fd6; border-radius: 4px;
        padding: 6px 18px; cursor: pointer; min-width: 120px; text-shadow: none; }
      #gate button:hover { background: #2a379a; }
      #gate button.primary { background: #2f7a32; border-color: #5fc463; }
      #gate button.primary:hover { background: #3a933e; }
      .panel { position: fixed; inset: 0; margin: auto; max-width: 560px; max-height: 92vh; overflow: auto;
        background: rgba(8, 12, 40, .96); border: 2px solid #5b6fd6; border-radius: 6px; padding: 12px 20px; color: #e8e8ff; }
      .panel h2 { margin: 4px 0 8px; font-size: 20px; }
      .panel h3 { margin: 14px 0 6px; font-size: 15px; color: #ffd84a; }
      .panel table { border-collapse: collapse; width: 100%; }
      .panel th { text-align: left; font-weight: normal; color: #9aa4e8; }
      .panel td { padding: 1px 4px; }
      .panel button { font: inherit; color: #fff; background: #1c2670; border: 1px solid #5b6fd6; border-radius: 3px; padding: 2px 8px; cursor: pointer; min-width: 90px; }
      .panel button:hover { background: #2a379a; }
      .panel button:disabled { opacity: .45; cursor: default; background: #1c2670; }
      .panel button.wait { background: #8a6d00; }
      .panel button.primary { background: #2f7a32; }
      .panel .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0; }
      .panel .note { color: #9aa4e8; font-size: 12px; }
      .panel input[type=range] { vertical-align: middle; margin-right: 8px; }
      .panel.stats { max-width: 640px; }
      .panel.stats p { margin: 4px 0; }
      .panel.stats .row span { background: #1c2670; border-radius: 3px; padding: 1px 8px; }
      .panel.stats .row span.done { background: #2f7a32; }
      .panel.stats td.num { text-align: right; font-variant-numeric: tabular-nums; }
      .panel.stats table.times td, .panel.stats table.times th { padding: 0 6px; }
      .panel.stats table.times tr:nth-child(even) td { background: rgba(91, 111, 214, .12); }
    </style>
  </head>
  <body>
    <div id="screen">
      <canvas id="canvas" width="320" height="240"></canvas>
      <video id="logo" hidden playsinline preload="auto">
        <source src="assets/jlogo.webm" type="video/webm" />
        <source src="assets/jlogo.mp4" type="video/mp4" />
      </video>
      <div id="hint" hidden></div>
    </div>
    <div id="message">Loading…</div>
    <div id="gate" hidden></div>
    <script type="module" src="/src/shell/main.ts"></script>
  </body>
</html>
