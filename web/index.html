<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris Plus Puzzle Mode (renderer preview)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #aaa; font: 13px sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
      canvas { image-rendering: pixelated; width: 960px; height: 720px; max-width: 100vw; max-height: calc(100vh - 40px); aspect-ratio: 4 / 3; }
    </style>
  </head>
  <body>
    <canvas id="screen" width="320" height="240"></canvas>
    <div id="status">Arrows move, Z/X rotate (Circle/Cross), Enter Start, Shift Select.</div>
    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
